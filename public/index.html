<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Plus Games</title>
<!-- self-hosted copy of https://telegram.org/js/telegram-web-app.js: telegram.org is filtered in some countries
     (e.g. Iran) even when the Telegram app itself works through a proxy, which left players stuck outside the app -->
<script src="telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button type="button" class="back" id="back" aria-label="Back to games" hidden>‹</button>
  <div class="who" id="who"><span class="avatar" id="avatar">?</span><span id="name">…</span></div>
  <div class="title" id="title" hidden></div>
  <div class="wallet" aria-live="polite"><span class="coin">🪙</span><b id="balance">—</b></div>
</header>

<main id="screen"></main>

<div class="toast" id="toast" role="alert" hidden></div>

<div class="gate" id="gate" hidden>
  <div>
    <div class="bigicon">🎮</div>
    <h1>Plus Games</h1>
    <p>Mines · Crash · Roulette · Poop<br>These games run inside Telegram.</p>
    <a class="cta" id="botLink" href="#">Open in Telegram</a>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
